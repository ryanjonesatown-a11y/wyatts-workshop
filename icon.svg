  <path d="M22 28 L38 78 L58 40 L78 78 L94 28" fill="none" stroke="url(#w1)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M22 28 L38 78 L58 40 L78 78 L94 28" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(-2 -3)"/>
